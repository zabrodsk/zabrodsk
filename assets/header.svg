<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Dusan Zabrodsky: I build agents, native apps and small strange internet things">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070c"/>
      <stop offset="1" stop-color="#0d0b1a"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c4b5fd"/>
      <stop offset="0.65" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.2"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="360" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="360" rx="24"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(400px); } }
    .r1 { animation: rise 0.9s cubic-bezier(.2,.8,.2,1) 0.1s both; }
    .r2 { animation: rise 0.9s cubic-bezier(.2,.8,.2,1) 0.35s both; }
    .r3 { animation: rise 0.9s cubic-bezier(.2,.8,.2,1) 0.6s both; }
    .r4 { animation: rise 0.9s cubic-bezier(.2,.8,.2,1) 0.85s both; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    .scan { animation: scan 7s linear infinite; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>

    <g filter="url(#blur)">
      <circle r="190" fill="url(#orbA)">
        <animateMotion dur="22s" repeatCount="indefinite" path="M920 90 C 1080 160, 1010 300, 860 260 S 760 40, 920 90 Z"/>
      </circle>
      <circle r="170" fill="url(#orbB)">
        <animateMotion dur="27s" repeatCount="indefinite" path="M1060 300 C 900 330, 820 200, 960 150 S 1180 220, 1060 300 Z"/>
      </circle>
      <circle r="140" fill="url(#orbC)">
        <animateMotion dur="31s" repeatCount="indefinite" path="M140 330 C 320 300, 420 380, 260 400 S 20 380, 140 330 Z"/>
      </circle>
    </g>

    <rect width="1200" height="360" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#a78bfa" opacity="0.12"/>

    <!-- window chrome -->
    <g transform="translate(64 50)">
      <circle cx="0" cy="0" r="6" fill="#ff5f57"/>
      <circle cx="20" cy="0" r="6" fill="#febc2e"/>
      <circle cx="40" cy="0" r="6" fill="#28c840"/>
      <text x="64" y="5" class="mono" font-size="13" fill="#8b8aa3">~/zabrodsk — zsh</text>
    </g>

    <g transform="translate(64 0)">
      <text class="mono r1" x="0" y="116" font-size="16" fill="#8b8aa3"><tspan fill="#a78bfa">❯</tspan> whoami</text>
      <text class="sans r2" x="-3" y="190" font-size="68" font-weight="800" letter-spacing="-2.5" fill="url(#name)">Dusan Zabrodsky</text>
      <text class="sans r3" x="0" y="236" font-size="22" fill="#d4d4e0">I build agents, native apps and small strange internet things.</text>
      <g class="r4">
        <text class="mono" x="0" y="296" font-size="15" fill="#8b8aa3"><tspan fill="#a78bfa">❯</tspan> ls ./building <tspan fill="#67e8f9">agents/</tspan>  <tspan fill="#f9a8d4">swift/</tspan>  <tspan fill="#fde68a">web/</tspan>  <tspan fill="#86efac">vc-ai/</tspan></text>
        <rect class="caret" x="382" y="282" width="9" height="18" fill="#c4b5fd"/>
      </g>
    </g>

    <!-- status chip -->
    <g transform="translate(948 40)"><g class="r4">
      <rect width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle class="dot" cx="20" cy="17" r="5" fill="#4ade80"/>
      <text x="34" y="22" class="mono" font-size="13" fill="#d4d4e0">shipping right now</text>
    </g></g>

    <rect x="0.5" y="0.5" width="1199" height="359" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
